# --- general ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

# --- keep manual window names (no auto-rename to dir / program title) ---
set -g automatic-rename off
set -g allow-rename off

# --- alt + number to switch windows ---
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 0
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-x confirm-before -p "Kill window? (y/n)" kill-window

# --- pane movement + resizing ---
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D
bind -n M-z resize-pane -Z

# --- reload config ---
bind r source-file ~/.tmux.conf \; display "reloaded tmux.conf"

# --- claude code dashboard (prefix + C, or Alt-a for quick popup) ---
bind C display-popup -E -w 90% -h 70% "~/.claude/bin/cc-status"
bind -n M-a display-popup -E -w 90% -h 70% "~/.claude/bin/cc-status"
# Alt-j: jump to the next pane waiting on input
bind -n M-j run-shell "~/.claude/bin/cc-status --jump"

# --- restart claude in current pane (C-c C-c, clear, relaunch) ---
bind q send-keys C-c \; send-keys C-c \; run-shell "sleep 0.3" \; send-keys "c" Enter \; send-keys "claude" Enter

# --- session switcher ---
bind s choose-tree -sZ
bind -n M-s choose-tree -sZ
#
# --- new panes inherit current pane's path ---
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# --- new windows inherit current pane's path ---
bind c new-window -c "#{pane_current_path}"

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# catppuccin theme config (layout only)
set -g status-left-length 30
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_disable_background 'on'
set -g @catppuccin_window_current_text " #{window_name}"
set -g @catppuccin_window_text " #{window_name}"

# --- session persistence ---
# Auto-save every 15 minutes
set -g @continuum-save-interval '15'
# Restore automatically when tmux starts
set -g @continuum-restore 'on'
# Enable resurrect save
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-processes ':all:'

run '~/.tmux/plugins/tpm/tpm'

# Override tmux-claude-session-manager picker: our layout is one session / many
# windows, so drive the picker off `claude agents --json` + pane-pid mapping.
bind u display-popup -B -w '90%' -h '90%' -E '~/.claude/bin/cc-tmux-picker.sh'
unbind y  # drop the plugin's launch binding
