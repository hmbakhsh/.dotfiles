    b = ['move-node-to-workspace B', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_refresh', 'mode main']
    c = ['move-node-to-workspace C', 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_refresh', 'mode main']
